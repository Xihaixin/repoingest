[project]
name = "repoingest"
dynamic = ["version"]
description = "Convert any Git repository into a text digest optimized for LLM prompts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "溪海莘" }]
keywords = ["git", "llm", "ingest", "digest", "repository", "codebase", "ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
    "gitpython>=3.1",
    "loguru>=0.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://repoingest.top"
Repository = "https://github.com/Xihaixin/repoingest"
Issues = "https://github.com/Xihaixin/repoingest/issues"

[project.scripts]
repoingest = "repoingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/repoingest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repoingest"]

[tool.hatch.build.targets.sdist]
include = [
    "src/repoingest",
    "README.md",
    "README_EN.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "fastapi-cli>=0.0.16",
    "flake8>=7.3.0",
    "rich>=14.2.0",
    "typer>=0.20.0",
]
# Web 服务（自托管）依赖。不随 PyPI 包发布，仅用于本仓库部署：
#   uv sync --group server
server = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "posthog>=3.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.30",
]
